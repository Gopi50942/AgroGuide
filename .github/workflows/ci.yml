name: AgroGuide Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit & integration test suite
        run: npm test

      - name: Run ESLint code quality checks
        run: npm run lint

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_VERSION: "2026.1-prod"
          NODE_ENV: production
